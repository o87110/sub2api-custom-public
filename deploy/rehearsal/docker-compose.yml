name: sub2api-rehearsal

services:
  sub2api:
    image: ${SUB2API_IMAGE:?SUB2API_IMAGE is required}
    restart: unless-stopped
    ports:
      - "${REHEARSAL_BIND_HOST:-127.0.0.1}:${REHEARSAL_PORT:-18081}:8080"
    volumes:
      - ./data:/app/data
      - ./runtime:/app/runtime
    environment:
      AUTO_SETUP: "true"
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: "8080"
      SERVER_MODE: release
      RUN_MODE: standard
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_USER: ${POSTGRES_USER:-sub2api_rehearsal}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      DATABASE_DBNAME: ${POSTGRES_DB:-sub2api_rehearsal}
      DATABASE_SSLMODE: disable
      DATABASE_MAX_OPEN_CONNS: "20"
      DATABASE_MAX_IDLE_CONNS: "5"
      DATABASE_CONN_MAX_LIFETIME_MINUTES: "30"
      DATABASE_CONN_MAX_IDLE_TIME_MINUTES: "5"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      REDIS_DB: "0"
      REDIS_POOL_SIZE: "64"
      REDIS_MIN_IDLE_CONNS: "5"
      REDIS_ENABLE_TLS: "false"
      ADMIN_EMAIL: ${ADMIN_EMAIL:?ADMIN_EMAIL is required}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY:?TOTP_ENCRYPTION_KEY is required}
      UPDATE_PROXY_URL: ${UPDATE_PROXY_URL:-}
      LOG_ENV: rehearsal
      LOG_SERVICE_NAME: sub2api-rehearsal
      TZ: ${TZ:-Asia/Shanghai}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 512m
    cpus: 0.50
    pids_limit: 256
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-T",
          "5",
          "-O",
          "/dev/null",
          "http://localhost:8080/health",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    command:
      - postgres
      - -c
      - max_connections=50
      - -c
      - shared_buffers=64MB
      - -c
      - effective_cache_size=256MB
      - -c
      - maintenance_work_mem=32MB
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      PGDATA: /var/lib/postgresql/data
      POSTGRES_USER: ${POSTGRES_USER:-sub2api_rehearsal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-sub2api_rehearsal}
      TZ: ${TZ:-Asia/Shanghai}
    mem_limit: 512m
    cpus: 0.50
    pids_limit: 128
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-sub2api_rehearsal} -d ${POSTGRES_DB:-sub2api_rehearsal}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command:
      - /bin/sh
      - -c
      - |
        exec redis-server \
          --save 60 1 \
          --appendonly yes \
          --appendfsync everysec \
          --requirepass "$${REDIS_PASSWORD}" \
          --maxmemory 64mb \
          --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      REDISCLI_AUTH: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      TZ: ${TZ:-Asia/Shanghai}
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 64
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
  redis_data:
