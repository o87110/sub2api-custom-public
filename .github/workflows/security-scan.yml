name: Security Scan

run-name: ${{ github.event_name == 'workflow_dispatch' && format('Security Scan target @ {0}', inputs.expected_sha) || github.ref_name }}

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      expected_sha:
        description: 'Exact main SHA that must be checked'
        required: true
        type: string
  schedule:
    - cron: '0 3 * * 1'

concurrency:
  group: security-scan-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify-target:
    runs-on: ubuntu-latest
    outputs:
      checkout_sha: ${{ steps.resolve.outputs.checkout_sha }}
    steps:
      - name: Verify dispatched revision
        id: resolve
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          checkout_sha="$GITHUB_SHA"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
              echo "Manual Security Scan dispatch must use refs/heads/main." >&2
              exit 1
            fi
            if [[ ! "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              echo "expected_sha must be a full 40-character commit SHA." >&2
              exit 1
            fi
            if [[ "$GITHUB_SHA" != "$EXPECTED_SHA" ]]; then
              echo "main resolved to ${GITHUB_SHA}, expected ${EXPECTED_SHA}." >&2
              exit 1
            fi
            checkout_sha="$EXPECTED_SHA"
          fi
          echo "checkout_sha=$checkout_sha" >> "$GITHUB_OUTPUT"

  backend-security:
    needs: verify-target
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.verify-target.outputs.checkout_sha }}
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache-dependency-path: backend/go.sum
      - name: Verify Go version
        run: |
          go version | grep -q 'go1.27.0'
      - name: Run govulncheck
        working-directory: backend
        run: |
          source ../.github/custom-tool-versions.env
          actual_sum="$(
            go mod download -json "golang.org/x/vuln@v${GOVULNCHECK_VERSION}" |
              jq -r '.Sum'
          )"
          test "$actual_sum" = "$GOVULNCHECK_MODULE_SUM"
          go install "golang.org/x/vuln/cmd/govulncheck@v${GOVULNCHECK_VERSION}"
          govulncheck ./...

  frontend-security:
    needs: verify-target
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.verify-target.outputs.checkout_sha }}
      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 9.15.9
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '20.20.2'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Run pnpm audit
        id: pnpm-audit
        working-directory: frontend
        run: |
          set +e
          pnpm audit --prod --audit-level=high --json > audit.json
          audit_exit_code=$?
          set -e
          python ../tools/validate_pnpm_audit.py \
            --audit audit.json \
            --exit-code "$audit_exit_code" \
            --state-output "$RUNNER_TEMP/pnpm-audit-state.env"
          cat "$RUNNER_TEMP/pnpm-audit-state.env" >> "$GITHUB_OUTPUT"
      - name: Check audit exceptions
        if: steps.pnpm-audit.outputs.audit_has_vulnerabilities == 'true'
        run: |
          python tools/check_pnpm_audit_exceptions.py \
            --audit frontend/audit.json \
            --exceptions .github/audit-exceptions.yml
