name: Release

on:
  push:
    tags:
      - 'v[0-9]*-custom.[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing immutable custom Tag to release or retry'
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

concurrency:
  group: release-exact-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions: {}

jobs:
  context:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    outputs:
      tag: ${{ steps.preflight.outputs.tag }}
      tag_ref_oid: ${{ steps.preflight.outputs.tag_ref_oid }}
      target_commit: ${{ steps.preflight.outputs.target_commit }}
      ci_run_id: ${{ steps.preflight.outputs.ci_run_id }}
      control_ci_run_id: ${{ steps.preflight.outputs.control_ci_run_id }}
      release_state: ${{ steps.preflight.outputs.release_state }}
      release_id: ${{ steps.preflight.outputs.release_id }}
      manifest_asset_id: ${{ steps.preflight.outputs.manifest_asset_id }}
    steps:
      - name: Checkout exact custom Tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          fetch-tags: true
          filter: blob:none
          persist-credentials: false
      - name: Materialize trusted Release preflight
        env:
          CONTROL_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            [[ "$GITHUB_REF" == "refs/heads/main" ]]
            control_ref="refs/remotes/origin/main"
            git show-ref --verify --quiet "$control_ref"
            git merge-base --is-ancestor "$CONTROL_COMMIT" "$control_ref"
          else
            [[ "$GITHUB_EVENT_NAME" == "push" ]]
            [[ "$GITHUB_REF" == "refs/tags/$RELEASE_TAG" ]]
          fi
          control_dir="$RUNNER_TEMP/release-control"
          mkdir -p "$control_dir"
          git show "${CONTROL_COMMIT}:deploy/release/custom-release-preflight.sh" \
            > "$control_dir/custom-release-preflight.sh"
          chmod 0700 "$control_dir/custom-release-preflight.sh"
      - name: Verify Tag, commit, CI, and existing Release state
        id: preflight
        env:
          CONTROL_COMMIT: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          /bin/bash "$RUNNER_TEMP/release-control/custom-release-preflight.sh" \
            --tag "$RELEASE_TAG" \
            --control-commit "$CONTROL_COMMIT" \
            --output "$GITHUB_OUTPUT"

  build:
    needs: context
    if: needs.context.outputs.release_state == 'none'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      payload_artifact_id: ${{ steps.payload.outputs.artifact-id }}
      payload_artifact_digest: ${{ steps.payload-metadata.outputs.digest }}
      manifest_artifact_id: ${{ steps.manifest.outputs.artifact-id }}
      manifest_artifact_digest: ${{ steps.manifest-metadata.outputs.digest }}
    steps:
      - name: Checkout exact Tag commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.context.outputs.target_commit }}
          fetch-depth: 0
          fetch-tags: true
          filter: blob:none
          persist-credentials: false
      - name: Set up exact Go toolchain
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: backend/go.mod
          check-latest: false
          cache-dependency-path: backend/go.sum
      - name: Install checksum-pinned build tools
        env:
          CUSTOM_TOOL_INSTALL_ROOT: ${{ runner.temp }}/custom-release-tools
        run: |
          /bin/bash deploy/tests/install-custom-tools.sh \
            node,pnpm,goreleaser,oras,buildx
      - name: Expose ephemeral GHA cache runtime
        continue-on-error: true
        uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0
      - name: Prepare verified frontend Release input
        id: frontend
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          /bin/bash deploy/release/frontend-dist.sh prepare \
            --ci-run-id "${{ needs.context.outputs.ci_run_id }}" \
            --commit "${{ needs.context.outputs.target_commit }}" \
            --directory "$GITHUB_WORKSPACE/backend/internal/web/dist" \
            --provenance "$RUNNER_TEMP/frontend-provenance.json" \
            --output "$GITHUB_OUTPUT"
      - name: Build archives, checksums, and OCI layout once
        env:
          CUSTOM_TOOL_INSTALL_ROOT: ${{ runner.temp }}/custom-release-tools
          CUSTOM_BUILDX_CACHE_SCOPE: sub2api-release-oci-v1
        run: |
          set -euo pipefail
          compatibility_files=(
            backend/cmd/server/VERSION
            backend/go.sum
          )
          version_file="${compatibility_files[0]}"
          go_sum_file="${compatibility_files[1]}"
          version_blob="$(git hash-object --path "$version_file" "$version_file")"
          go_sum_blob="$(git hash-object --path "$go_sum_file" "$go_sum_file")"
          restore_build_inputs() {
            git update-index --no-assume-unchanged -- "${compatibility_files[@]}" >/dev/null 2>&1 || true
            git restore --source=HEAD --worktree -- "${compatibility_files[@]}" >/dev/null 2>&1 || true
          }
          trap restore_build_inputs EXIT
          git update-index --assume-unchanged -- "${compatibility_files[@]}"
          /bin/bash deploy/release/build-release-payload.sh \
            --tag "${{ needs.context.outputs.tag }}" \
            --commit "${{ needs.context.outputs.target_commit }}" \
            --frontend-provenance "$RUNNER_TEMP/frontend-provenance.json" \
            --output "$RUNNER_TEMP/release-payload"
          restore_build_inputs
          trap - EXIT
          [[ "$(git hash-object --path "$version_file" "$version_file")" == "$version_blob" ]]
          [[ "$(git hash-object --path "$go_sum_file" "$go_sum_file")" == "$go_sum_blob" ]]
          git diff --exit-code
      - name: Start payload Artifact upload timer
        id: payload-upload-start
        run: echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"
      - name: Upload non-production payload artifact
        id: payload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-payload-${{ needs.context.outputs.tag }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-payload/
          if-no-files-found: error
          retention-days: 30
      - name: Normalize payload artifact metadata
        id: payload-metadata
        env:
          RAW_DIGEST: ${{ steps.payload.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          digest="$RAW_DIGEST"
          if [[ "$digest" =~ ^[0-9a-f]{64}$ ]]; then
            digest="sha256:${digest}"
          fi
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Record payload Artifact upload time
        id: payload-upload-timing
        env:
          STARTED_AT: ${{ steps.payload-upload-start.outputs.started_at }}
        run: |
          set -euo pipefail
          echo "seconds=$(($(date +%s) - STARTED_AT))" >> "$GITHUB_OUTPUT"
      - name: Create immutable release manifest
        env:
          CONTROL_COMMIT: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          PAYLOAD_ARTIFACT_ID: ${{ steps.payload.outputs.artifact-id }}
          PAYLOAD_ARTIFACT_DIGEST: ${{ steps.payload-metadata.outputs.digest }}
          PAYLOAD_ARTIFACT_NAME: release-payload-${{ needs.context.outputs.tag }}-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          control_ref="refs/custom-release-control/${GITHUB_RUN_ID}"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            [[ "$GITHUB_REF" == "refs/heads/main" ]]
            remote_control_commit="$(
              gh api \
                "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" \
                --jq '.object.sha | select(test("^[0-9a-f]{40}$"))'
            )"
            git update-ref "$control_ref" "$remote_control_commit"
            git merge-base --is-ancestor "$CONTROL_COMMIT" "$control_ref"
          else
            [[ "$GITHUB_EVENT_NAME" == "push" ]]
            [[ "$GITHUB_REF" == "refs/tags/${{ needs.context.outputs.tag }}" ]]
            [[ "$CONTROL_COMMIT" == "${{ needs.context.outputs.target_commit }}" ]]
          fi
          control_dir="$RUNNER_TEMP/release-control"
          mkdir -p "$control_dir"
          git show "${CONTROL_COMMIT}:deploy/release/create-release-manifest.sh" \
            > "$control_dir/create-release-manifest.sh"
          chmod 0700 "$control_dir/create-release-manifest.sh"
          mkdir -p "$RUNNER_TEMP/release-manifest"
          /bin/bash "$control_dir/create-release-manifest.sh" \
            --payload "$RUNNER_TEMP/release-payload" \
            --output "$RUNNER_TEMP/release-manifest/release-manifest.json" \
            --tag-ref-oid "${{ needs.context.outputs.tag_ref_oid }}" \
            --artifact-id "$PAYLOAD_ARTIFACT_ID" \
            --artifact-digest "$PAYLOAD_ARTIFACT_DIGEST" \
            --artifact-name "$PAYLOAD_ARTIFACT_NAME"
      - name: Start manifest Artifact upload timer
        id: manifest-upload-start
        run: echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"
      - name: Upload release manifest artifact
        id: manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-manifest-${{ needs.context.outputs.tag }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-manifest/release-manifest.json
          if-no-files-found: error
          retention-days: 30
      - name: Normalize manifest artifact metadata
        id: manifest-metadata
        env:
          RAW_DIGEST: ${{ steps.manifest.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          digest="$RAW_DIGEST"
          if [[ "$digest" =~ ^[0-9a-f]{64}$ ]]; then
            digest="sha256:${digest}"
          fi
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Record Artifact upload timing
        env:
          MANIFEST_STARTED_AT: ${{ steps.manifest-upload-start.outputs.started_at }}
          MANIFEST_DIGEST: ${{ steps.manifest-metadata.outputs.digest }}
          PAYLOAD_SECONDS: ${{ steps.payload-upload-timing.outputs.seconds }}
        run: |
          set -euo pipefail
          manifest_seconds=$(($(date +%s) - MANIFEST_STARTED_AT))
          artifact_seconds=$((PAYLOAD_SECONDS + manifest_seconds))
          {
            echo "### Release Artifact uploads"
            echo
            echo "- Tag: \`${{ needs.context.outputs.tag }}\`"
            echo "- Commit: \`${{ needs.context.outputs.target_commit }}\`"
            echo "- Payload artifact ID: \`${{ steps.payload.outputs.artifact-id }}\`"
            echo "- Payload artifact digest: \`${{ steps.payload-metadata.outputs.digest }}\`"
            echo "- Manifest artifact ID: \`${{ steps.manifest.outputs.artifact-id }}\`"
            echo "- Manifest artifact digest: \`${MANIFEST_DIGEST}\`"
            echo "- Payload upload: \`${PAYLOAD_SECONDS}s\`"
            echo "- Manifest upload: \`${manifest_seconds}s\`"
            echo "- Artifact uploads total: \`${artifact_seconds}s\`"
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: [context, build]
    if: >-
      ${{
        always() &&
        needs.context.result == 'success' &&
        (
          needs.build.result == 'success' ||
          needs.build.result == 'skipped'
        )
      }}
    runs-on: ubuntu-latest
    environment: custom-release-publish
    permissions:
      actions: read
      contents: write
      packages: write
    steps:
      - name: Checkout exact Tag commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.context.outputs.target_commit }}
          fetch-depth: 0
          fetch-tags: true
          filter: blob:none
          persist-credentials: false
      - name: Install checksum-pinned ORAS
        env:
          CUSTOM_TOOL_INSTALL_ROOT: ${{ runner.temp }}/custom-release-tools
        run: /bin/bash deploy/tests/install-custom-tools.sh oras
      - name: Start publication timer
        id: publication-start
        run: echo "started_at=$(date +%s)" >> "$GITHUB_OUTPUT"
      - name: Verify immutable state and publish
        id: publish-release
        env:
          CONTROL_COMMIT: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          GHCR_TOKEN: ${{ github.token }}
          CURRENT_PAYLOAD_ARTIFACT_ID: ${{ needs.build.outputs.payload_artifact_id }}
          CURRENT_PAYLOAD_ARTIFACT_DIGEST: ${{ needs.build.outputs.payload_artifact_digest }}
          CURRENT_MANIFEST_ARTIFACT_ID: ${{ needs.build.outputs.manifest_artifact_id }}
          CURRENT_MANIFEST_ARTIFACT_DIGEST: ${{ needs.build.outputs.manifest_artifact_digest }}
        run: |
          set -euo pipefail
          control_ref="refs/custom-release-control/${GITHUB_RUN_ID}"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            [[ "$GITHUB_REF" == "refs/heads/main" ]]
            remote_control_commit="$(
              gh api \
                "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" \
                --jq '.object.sha | select(test("^[0-9a-f]{40}$"))'
            )"
            git update-ref "$control_ref" "$remote_control_commit"
            git merge-base --is-ancestor "$CONTROL_COMMIT" "$control_ref"
          else
            [[ "$GITHUB_EVENT_NAME" == "push" ]]
            [[ "$GITHUB_REF" == "refs/tags/${{ needs.context.outputs.tag }}" ]]
            [[ "$CONTROL_COMMIT" == "${{ needs.context.outputs.target_commit }}" ]]
          fi
          control_dir="$RUNNER_TEMP/release-control"
          mkdir -p "$control_dir"
          for control_path in \
            deploy/release/publish-release.sh \
            deploy/release/release-notes.sh \
            deploy/release/release-state-policy.sh; do
            git show "${CONTROL_COMMIT}:${control_path}" \
              > "$control_dir/${control_path##*/}"
          done
          chmod 0700 \
            "$control_dir/publish-release.sh" \
            "$control_dir/release-notes.sh" \
            "$control_dir/release-state-policy.sh"
          args=(
            --tag "${{ needs.context.outputs.tag }}"
            --tag-ref-oid "${{ needs.context.outputs.tag_ref_oid }}"
            --commit "${{ needs.context.outputs.target_commit }}"
          )
          if [[ "${{ needs.build.result }}" == "success" ]]; then
            args+=(
              --current-manifest-artifact-id "$CURRENT_MANIFEST_ARTIFACT_ID"
              --current-manifest-artifact-digest "$CURRENT_MANIFEST_ARTIFACT_DIGEST"
              --current-payload-artifact-id "$CURRENT_PAYLOAD_ARTIFACT_ID"
              --current-payload-artifact-digest "$CURRENT_PAYLOAD_ARTIFACT_DIGEST"
            )
          fi
          /bin/bash "$control_dir/publish-release.sh" "${args[@]}"
      - name: Record publication timing
        if: ${{ always() }}
        env:
          STARTED_AT: ${{ steps.publication-start.outputs.started_at }}
          PUBLISH_RESULT: ${{ steps.publish-release.outcome }}
        run: |
          set -euo pipefail
          elapsed_seconds=$(($(date +%s) - STARTED_AT))
          {
            echo "### Release publication timing"
            echo
            echo "- Result: \`${PUBLISH_RESULT}\`"
            echo "- Publication: \`${elapsed_seconds}s\`"
          } >> "$GITHUB_STEP_SUMMARY"

  report-release-failure:
    needs: [context, build, publish]
    if: >-
      ${{
        always() &&
        (
          needs.context.result != 'success' ||
          (
            needs.build.result != 'success' &&
            needs.build.result != 'skipped'
          ) ||
          needs.publish.result != 'success'
        )
      }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Create or reuse Release failure issue
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          title="Custom ${tag} Release blocked"
          existing="$(
            gh issue list \
              --repo "$GITHUB_REPOSITORY" \
              --state open \
              --search "$title in:title" \
              --json number \
              --jq '.[0].number'
          )"
          if [[ -z "$existing" ]]; then
            gh issue create \
              --repo "$GITHUB_REPOSITORY" \
              --title "$title" \
              --body "Release preflight, payload verification, or immutable publication failed. The workflow did not mark an unverified Draft as published.

          Workflow: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          fi
